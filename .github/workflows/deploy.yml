name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the CLI repo trigger a redeploy after an installer change, and lets a
  # human refresh the star counts baked in at build time.
  workflow_dispatch:
  repository_dispatch:
    types: [installer-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A deploy must never ship a bundle that posts to a host which is not
      # PostHog. vars.POSTHOG_HOST once pointed at a deleted Vercel proxy and
      # every event from every visitor was dropped for months without a single
      # failure anywhere — see scripts/check-analytics-host.sh for the full
      # story. This gate is what makes that outage impossible to redeploy.
      - name: Check the analytics host the site will ship
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          # Mirrors the fallback in src/lib/analytics/core.ts, so an unset
          # variable is checked against the host the bundle would really use.
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
          LABEL: site bundle and content hub (vars.POSTHOG_HOST)
        run: ./scripts/check-analytics-host.sh

      # archcore.ai/install.{sh,ps1} serves the real installer rather than a
      # one-line redirect to raw.githubusercontent.com. That keeps one fewer
      # host in the critical path of `curl … | bash` and moves the only fetch
      # of raw.githubusercontent.com from every user's install to one CI run.
      # The copies in public/ are committed so local builds and previews work;
      # this step refreshes them so a deploy always ships the current script.
      - name: Sync installers from the CLI repo
        env:
          # The same public project key the site bundle ships. The installers
          # carry a `__POSTHOG_KEY__` placeholder in the CLI repo, so the key
          # never lands in git there and any copy run straight from that repo —
          # a local test, install-smoke.yml, a fork — reports nothing at all.
          # archcore.ai is therefore the only place that turns install analytics
          # on, which is why the substitution lives in this step.
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
        run: |
          set -euo pipefail

          # Checked before the downloads so a misconfigured variable fails in
          # one obvious line rather than as a confusing npm build failure later.
          case "${POSTHOG_KEY:-}" in
            phc_*) ;;
            '')
              echo "::error::POSTHOG_KEY variable is not set — the installers would ship with analytics disabled"
              exit 1
              ;;
            *)
              echo "::error::POSTHOG_KEY does not look like a PostHog *project* key (expected a phc_ prefix)"
              exit 1
              ;;
          esac

          base=https://raw.githubusercontent.com/archcore-ai/cli/refs/heads/main
          for f in install.sh install.ps1; do
            tmp=$(mktemp)
            curl -fsSL --retry 3 --retry-delay 2 "$base/$f" -o "$tmp"
            # A truncated download or an HTML error page must fail the build
            # loudly rather than silently replace a working installer.
            test -s "$tmp"
            head -1 "$tmp" | grep -qE '^#!|^#Requires' || {
              echo "::error::$f from the CLI repo does not look like an installer"
              exit 1
            }
            # Compared before the substitution below, so this keeps comparing
            # the committed placeholder copy against the freshly fetched one
            # instead of reporting a change on every single deploy.
            if cmp -s "$tmp" "public/$f"; then
              echo "public/$f already current"
            else
              echo "::notice::public/$f refreshed from the CLI repo"
            fi

            # Exactly one occurrence is expected: the assignment. A rename in
            # the CLI repo, or a second copy of the token, must fail the deploy
            # rather than publish an installer that quietly reports nothing —
            # that failure mode looks identical to "nobody is installing".
            occurrences=$(grep -c '__POSTHOG_KEY__' "$tmp" || true)
            if [ "${occurrences:-0}" -ne 1 ]; then
              echo "::error::$f carries ${occurrences:-0} POSTHOG_KEY placeholders, expected exactly 1"
              exit 1
            fi
            sed -i "s|__POSTHOG_KEY__|${POSTHOG_KEY}|" "$tmp"

            mv "$tmp" "public/$f"
          done
          # public/ now holds the injected key. Nothing commits it — the deploy
          # uploads dist/ only — but a future step that pushed public/ back to
          # git would leak it, so this must stay the last mutation of these two
          # files.

      # The installers carry their own host, baked into the CLI repo rather
      # than read from vars.POSTHOG_HOST, so this is checked separately from
      # the site host above. It runs after the sync step on purpose: what is
      # checked is the copy this deploy is about to publish, not the one
      # committed here.
      #
      # This gates the deploy. It spent one day at MODE=warn while the CLI repo
      # still carried the dead ph.archcore.ai, since blocking the whole site on
      # a host owned by another repository would have been the wrong trade —
      # see .archcore/infrastructure/analytics-host-must-reach-posthog.adr.md.
      - name: Check the analytics host the installers will ship
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          LABEL: install.sh and install.ps1 (baked into the CLI repo)
        run: |
          set -euo pipefail
          POSTHOG_HOST="$(sed -n 's/^POSTHOG_HOST="\(.*\)"$/\1/p' public/install.sh)"
          if [ -z "$POSTHOG_HOST" ]; then
            echo "::error::could not read POSTHOG_HOST out of public/install.sh"
            exit 1
          fi
          export POSTHOG_HOST
          ./scripts/check-analytics-host.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Raises the build-time star fetch from 60 to 1000 req/hour so a busy
          # Actions runner IP cannot rate-limit the deploy.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Astro exposes PUBLIC_* to browser code. Keep the build guard so
          # an unset repository variable fails instead of disabling analytics.
          PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      # Browser checks serve dist locally and block external requests, including
      # analytics. Verify the exact production build before archiving it.
      - name: Check the built site in Chromium
        run: npm run test:browser

      - name: Archive this release for rollback
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf release/site.tar.gz -C dist .
          (cd release && sha256sum site.tar.gz > site.tar.gz.sha256)
          jq -n \
            --arg sha "$RELEASE_SHA" \
            --arg repository "$RELEASE_REPOSITORY" \
            --arg run_id "$RELEASE_RUN_ID" \
            --arg run_attempt "$RELEASE_RUN_ATTEMPT" \
            '{sha: $sha, repository: $repository, run_id: $run_id, run_attempt: $run_attempt}' \
            > release/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: site-release
          path: release/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 30

      - id: deployment
        uses: actions/deploy-pages@v4
