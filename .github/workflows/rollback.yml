name: Restore GitHub Pages release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Deploy to GitHub Pages run ID with a site-release artifact
        required: true
        type: string
      expected_sha:
        description: Full 40-character commit SHA of that deployment
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Serialize restores with normal deployments. A later main push can replace
# the restored site; revert the faulty source commit before resuming releases.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate the source deployment
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const runId = process.env.SOURCE_RUN_ID;
            const sha = process.env.EXPECTED_SHA;
            if (!/^[1-9][0-9]*$/.test(runId) || !/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('Provide a numeric run ID and a full lowercase commit SHA.');
            }
            const repo = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: runId });
            const { data: workflow } = await github.rest.actions.getWorkflow({ ...repo, workflow_id: run.workflow_id });
            if (workflow.path !== '.github/workflows/deploy.yml' ||
                run.head_branch !== 'main' || run.head_sha !== sha ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                !['push', 'workflow_dispatch', 'repository_dispatch'].includes(run.event)) {
              throw new Error('Source must be a successful deploy.yml run from main at the expected SHA.');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repo, run_id: runId, per_page: 100,
            });
            const releases = artifacts.filter(a => a.name === 'site-release' && !a.expired);
            if (releases.length !== 1) {
              throw new Error('Source needs exactly one unexpired site-release artifact. Older deployments may not have one.');
            }
            core.setOutput('run_attempt', String(run.run_attempt));
            core.setOutput('artifact_id', String(releases[0].id));

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and extract the original site
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg repository "$RELEASE_REPOSITORY" \
            --arg run_id "$SOURCE_RUN_ID" \
            --arg run_attempt "$SOURCE_RUN_ATTEMPT" \
            '.sha == $sha and .repository == $repository and .run_id == $run_id and .run_attempt == $run_attempt' \
            release/manifest.json > /dev/null
          (cd release && sha256sum --check site.tar.gz.sha256)
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          output = Path('dist')
          output.mkdir()
          with tarfile.open('release/site.tar.gz', 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not (member.isfile() or member.isdir()):
                      raise SystemExit(f'Unexpected archive entry: {member.name}')
              archive.extractall(output, filter='data')
          for required in ('index.html', '404.html', 'sitemap.xml', 'robots.txt', 'install.sh', 'install.ps1'):
              if not (output / required).is_file():
                  raise SystemExit(f'Missing release file: {required}')
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 30

      - id: deployment
        uses: actions/deploy-pages@v4

      # Same check deploy.yml runs after every publish: proves the restored
      # release is actually being served before this run is called done.
      - name: Smoke-check the restored site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # Pages can 404 or serve the previous build for a while after
          # deploy-pages reports success, and curl treats a 404 as a completed
          # request, so --retry would not cover it. Poll to a deadline instead:
          # a slow CDN edge must not turn a good deploy red.
          body_file="$(mktemp)"
          deadline=$(( SECONDS + 180 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            status="$(curl -sSL --max-time 20 -o "$body_file" -w '%{http_code}' "$PAGE_URL")" || status=000
            if [ "$status" = "200" ] && grep -q "Archcore" "$body_file"; then
              echo "Smoke check passed on attempt ${attempt}: ${PAGE_URL} is live"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            echo "Attempt ${attempt}: HTTP ${status} without the expected content, retrying in 10s"
            sleep 10
          done
          echo "::error::Smoke check failed after ${attempt} attempts: ${PAGE_URL} last returned HTTP ${status} without the expected content"
          exit 1

      - name: Record the restored release
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          {
            echo "Restored site-release from run $SOURCE_RUN_ID."
            echo "Source commit: $EXPECTED_SHA"
            echo 'The original HTML, assets, and installers were republished without rebuilding.'
          } >> "$GITHUB_STEP_SUMMARY"
