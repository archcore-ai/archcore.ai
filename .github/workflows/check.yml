name: Check site

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-site-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PRs use the committed installer copies and no PostHog key. This also
      # works for forks without repository variables or deployment permissions.
      - run: npm run build
        env:
          ALLOW_MISSING_ANALYTICS_KEY: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Check the built site in Chromium
        run: npm run test:browser
